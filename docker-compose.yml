name: zhixing-quiz

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-zhixing_dev_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixing_quiz}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["chroma", "run", "--host", "0.0.0.0", "--port", "8001", "--path", "/app/data/chroma"]
    ports:
      - "${CHROMA_PORT:-8001}:8001"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v2/heartbeat', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8001
      CHROMA_PERSIST_DIR: /app/data/chroma
      KB_UPLOAD_DIR: /app/data/uploads
      LOCAL_IMAGE_DIR: /app/data/static/quiz-images
      UVICORN_WORKERS: 2
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8001
      CHROMA_PERSIST_DIR: /app/data/chroma
      KB_UPLOAD_DIR: /app/data/uploads
      LOCAL_IMAGE_DIR: /app/data/static/quiz-images
    volumes:
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  app_data:
