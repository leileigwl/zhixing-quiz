# 知行快刷（ZhiXing Quiz）生产编排：单机小内存（2C / 2G 级）云服务器
# 用法（在仓库根目录执行，deploy.sh 已封装）：
#   docker compose --env-file backend/.env -f deploy/docker-compose.prod.yml -p zhixing-quiz-prod up -d --build
# 约定：
#   - 只有 API 对宿主机暴露，且只绑 127.0.0.1:8010，由宿主机 Nginx 反向代理；MySQL / Redis / Chroma 仅走内部网络。
#   - 所有数据走命名卷持久化；不改开发用的根目录 docker-compose.yml。
#   - MYSQL_PASSWORD 通过 --env-file backend/.env 插值，backend/.env 只存在于服务器（chmod 600），绝不提交。

name: zhixing-quiz-prod

x-backend-env: &backend-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  REDIS_URL: redis://redis:6379/0
  CHROMA_HOST: chroma
  CHROMA_PORT: "8001"
  KB_UPLOAD_DIR: /app/data/uploads
  LOCAL_IMAGE_DIR: /app/data/static/quiz-images

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 小内存调优
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --innodb-redo-log-capacity=64M
      - --max-connections=60
      - --table-open-cache=256
      - --table-definition-cache=256
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --key-buffer-size=8M
      - --thread-cache-size=8
      - --skip-name-resolve
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?backend/.env 中必须设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixing_quiz}
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ARQ 队列与限流数据不可被淘汰，故 noeviction；AOF 持久化
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  chroma:
    build: &backend-build
      context: ../backend
      dockerfile: Dockerfile
      # 国内服务器构建加速（可选，写在 backend/.env 里；阿里云 ECS 用内网镜像，不走公网、不限速）：
      #   PYPI_MIRROR=http://mirrors.cloud.aliyuncs.com/pypi/simple/   DEBIAN_MIRROR=mirrors.cloud.aliyuncs.com
      args:
        PYPI_MIRROR: ${PYPI_MIRROR:-}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    image: zhixing-quiz-backend:prod
    restart: unless-stopped
    command: ["chroma", "run", "--host", "0.0.0.0", "--port", "8001", "--path", "/data/chroma"]
    volumes:
      - chroma_data:/data/chroma
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v2/heartbeat', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: *backend-build
    image: zhixing-quiz-backend:prod
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      <<: *backend-env
      UVICORN_WORKERS: "1"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - uploads:/app/data/uploads
      - quiz_images:/app/data/static/quiz-images
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy

  worker:
    build: *backend-build
    image: zhixing-quiz-backend:prod
    restart: unless-stopped
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    env_file:
      - ../backend/.env
    environment:
      <<: *backend-env
    volumes:
      - uploads:/app/data/uploads
      - quiz_images:/app/data/static/quiz-images
    mem_limit: 384m
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  uploads:
  quiz_images:
